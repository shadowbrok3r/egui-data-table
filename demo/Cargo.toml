[package]
name = "demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "demo"
path = "../examples/demo.rs"

[dependencies]
egui = "0.37"
egui_extras = { version = "0.37", default-features = false, features = [
    "serde",
] }
eframe = { version = "0.37", features = ["serde", "persistence"] }

egui-data-table = { path = "..", default-features = false }
env_logger = "0.11.5"

fastrand = "2"
names = { version = "0.14", default-features = false }
getrandom = { version = "0.2", features = ["js"] }

tap = "1"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
# ahash pulls getrandom 0.3, which needs the wasm_js backend enabled on wasm32.
getrandom_v03 = { package = "getrandom", version = "0.3", features = [
    "wasm_js",
] }

[features]
default = ["persistency"]
persistency = ["egui-data-table/persistency"]
